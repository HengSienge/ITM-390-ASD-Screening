[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itm390-asd-screening"
version = "0.1.0"
description = "Comparative Analysis of Machine Learning Models for Autism Spectrum Disorder Screening in Children (ITM-390, AUPP Group 10)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lyching KONG" },
    { name = "Lishang KEAV" },
    { name = "Sienge HENG", email = "hengsienge@gmail.com" },
    { name = "Lydana TAN" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "nbconvert>=7.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
